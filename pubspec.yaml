name: flutter_zenith
description: >-
  Container-scoped state management and dependency injection engine for
  Flutter. Features surgical rendering, async lifecycle guards, and type-safe DI.
repository: https://github.com/mihaimyh/flutter_zenith
homepage: https://github.com/mihaimyh/flutter_zenith
issue_tracker: https://github.com/mihaimyh/flutter_zenith/issues
topics:
  - state-management
  - dependency-injection
  - reactive
  - signals

version: 0.14.1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.24.0

