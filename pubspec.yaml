name: flutter_zenith
description: >-
  A high-performance, container-scoped state management and dependency injection
  engine for Flutter. Zero-dependency, surgical rendering, async lifecycle
  guards, and type-safe DI — all in one package.
repository: https://github.com/mihaimyh/flutter_zenith
homepage: https://github.com/mihaimyh/flutter_zenith
issue_tracker: https://github.com/mihaimyh/flutter_zenith/issues
topics:
  - state-management
  - dependency-injection
  - reactive
  - signals

version: 0.11.4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.24.0

